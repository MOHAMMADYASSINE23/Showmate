name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_TMDB_API_KEY: ci-placeholder-tmdb-key
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Report full dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = require("./npm-audit.json"); console.log("Full dependency audit:", JSON.stringify(a.metadata?.vulnerabilities || a.error || {}, null, 2))'
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: 'http://localhost:3000'